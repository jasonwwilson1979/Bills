services:
  web:
    build: .
    image: billflow:latest
    container_name: billflow-web
    restart: unless-stopped
    ports:
      # Host port (BILLFLOW_PORT) and in-container port (BILLFLOW_CONTAINER_PORT)
      # are both configurable via the stack's environment variables.
      # Default mapping: host 8000 -> container 8000.
      - "${BILLFLOW_PORT:-8000}:${BILLFLOW_CONTAINER_PORT:-8000}"
    # Configuration comes from the environment: either a .env file next to
    # this compose file (what deploy-to-ubuntu.ps1 creates on the server) or
    # the environment variables set in Portainer's stack UI.
    environment:
      DJANGO_DB_PATH: /data/db.sqlite3
      DJANGO_DEBUG: "False"
      BILLFLOW_CONTAINER_PORT: ${BILLFLOW_CONTAINER_PORT:-8000}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_SECURE_PROXY_SSL_HEADER: ${DJANGO_SECURE_PROXY_SSL_HEADER:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - billflow-data:/data

  # Optional: automatic-HTTPS reverse proxy. Enable with:
  #   BILLFLOW_DOMAIN=bills.example.com sudo docker compose --profile caddy up -d --build
  # (also put BILLFLOW_DOMAIN=bills.example.com in .env)
  caddy:
    image: caddy:2-alpine
    container_name: billflow-caddy
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      BILLFLOW_DOMAIN: ${BILLFLOW_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  billflow-data:
  caddy-data:
  caddy-config:
